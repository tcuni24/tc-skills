# herdr plugin manifest for herdr-pair (issue #10, round p01-r002).
# One event subscription only: when a pane's agent status changes, herdr runs the
# resume hook, which delivers an armed resume prompt to the planner exactly once
# via `pairctl resume-deliver --via plugin`. Executor-pane behavior is issue #12.
id = "tc.herdr-pair"
name = "herdr-pair resume hook"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "hooks/on_planner_status.py"]
